<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>EduRapor — Tidak ada koneksi</title>
  <style>
    :root { --bg: #f1f5f9; --kartu: #ffffff; --teks: #0f172a; --redup: #64748b; --biru: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --kartu: #1e293b; --teks: #e2e8f0; --redup: #94a3b8; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--teks);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kartu { max-width: 380px; width: 100%; background: var(--kartu); border-radius: 18px; padding: 32px 24px; text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.25rem; margin: 18px 0 8px; }
    p { color: var(--redup); line-height: 1.5; margin: 0 0 22px; font-size: .95rem; }
    button { background: var(--biru); color: #fff; border: 0; border-radius: 999px; padding: 10px 22px; font-weight: 600; font-size: .95rem; cursor: pointer; }
  </style>
</head>
<body>
  <main class="kartu">
    <img src="/icons/icon-192.png" alt="">
    <h1>Tidak ada koneksi internet</h1>
    <p>EduRapor perlu terhubung ke server sekolah. Periksa sinyal atau Wi-Fi, lalu coba lagi. Data yang sudah tersimpan tetap aman.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
