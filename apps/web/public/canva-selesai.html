<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canva tersambung</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f8fafc; color: #1f2937; text-align: center; padding: 16px; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } }
  p { max-width: 360px; line-height: 1.5; }
</style>
</head>
<body>
<p id="pesan">Memproses…</p>
<script>
  // Penutup jendela pop-up OAuth Canva (Studio Rakit Video E3): kabari tab Studio lalu tutup jendela ini.
  // BroadcastChannel dipakai karena halaman Canva dapat memutus window.opener (Cross-Origin-Opener-Policy).
  (function () {
    var status = new URLSearchParams(location.search).get("canva") || "gagal";
    var teks = { tersambung: "Akun Canva tersambung. Jendela ini boleh ditutup.", batal: "Penyambungan Canva dibatalkan. Jendela ini boleh ditutup.", gagal: "Penyambungan Canva gagal. Tutup jendela ini lalu coba lagi dari Studio." };
    document.getElementById("pesan").textContent = teks[status] || teks.gagal;
    try { new BroadcastChannel("studio-canva").postMessage({ canva: status }); } catch (e) {}
    try { localStorage.setItem("studio-canva", status + ":" + Date.now()); } catch (e) {}
    setTimeout(function () { window.close(); }, 600);
  })();
</script>
</body>
</html>
