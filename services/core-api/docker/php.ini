; Tuning performa untuk dev di Docker Desktop (Windows/WSL2).
; Kode aplikasi dibaca lewat bind mount yang lambat, jadi hasil kompilasi & lookup path di-cache.
memory_limit = 256M

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Tetap cek perubahan file (maks. tiap 2 detik) agar edit kode langsung terpakai
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Lampiran jadwal/jurnal (maks. 10 MB) dikirim sebagai base64 di body JSON (±13,4 MB);
; dokumen resmi Pustaka Dokumen (PDF CP/Kepka, maks. 50 MB) dikirim bersama teks hasil baca browser
post_max_size = 64M
upload_max_filesize = 50M
