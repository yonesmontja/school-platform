services:
  db:
    image: postgres:16
    container_name: school_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_platform
      POSTGRES_USER: school_admin
      # Kata sandi di infra/.env (tidak masuk git)
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di infra/.env}
    # Port database, redis, dan API hanya dibuka untuk komputer ini (bukan jaringan lokal/internet).
    # Akses dari luar lewat web (port 3000) atau tunnel cloudflared.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: school_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  core-api:
    build: ../services/core-api
    container_name: school_core_api
    restart: unless-stopped
    env_file:
      - ../services/core-api/.env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di infra/.env}
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../services/core-api:/var/www/html
      # vendor di volume Docker: membaca ribuan file vendor lewat bind mount Windows membuat tiap request ~4 detik
      - core_api_vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 60s
      timeout: 10s
      retries: 3

  # API untuk tes web end-to-end (tests/web): kode sama dengan core-api, tetapi memakai database
  # terpisah berisi sekolah fiktif. Hanya berjalan bila diminta: docker compose --profile e2e up -d core-api-e2e
  core-api-e2e:
    profiles: ["e2e"]
    build: ../services/core-api
    container_name: school_core_api_e2e
    restart: "no"
    env_file:
      - ../services/core-api/.env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di infra/.env}
      DB_DATABASE: school_platform_e2e
      APP_ENV: testing
      APP_DEBUG: "true"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      FILESYSTEM_DISK: local
      # artisan serve melayani beberapa permintaan sekaligus (satu halaman memanggil 5–10 API)
      PHP_CLI_SERVER_WORKERS: "6"
    depends_on:
      - db
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - ../services/core-api:/var/www/html
      - core_api_vendor:/var/www/html/vendor

  # Tugas terjadwal Laravel (routes/console.php): arsip Log Aktivitas, bersihkan token kedaluwarsa
  scheduler:
    build: ../services/core-api
    container_name: school_scheduler
    restart: unless-stopped
    env_file:
      - ../services/core-api/.env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di infra/.env}
    depends_on:
      - core-api
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ../services/core-api:/var/www/html
      - core_api_vendor:/var/www/html/vendor

  # Situs publik (lewat tunnel): build produksi. Perubahan kode baru tampil setelah diterbitkan
  # ulang (infra/terbitkan.sh), jadi pengguna tidak melihat pekerjaan yang belum selesai.
  web:
    build:
      context: ../apps/web
      target: prod
      args:
        # Browser memanggil /api di domain web; Next.js meneruskannya ke core-api lewat jaringan Docker
        API_INTERNAL_URL: http://core-api:8000
    container_name: school_web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://core-api:8000
    depends_on:
      - core-api
    # Bawaan hanya untuk komputer ini; perangkat lain memakai tunnel HTTPS. Untuk membuka ke
    # jaringan lokal (http, tanpa enkripsi), jalankan dengan WEB_BIND=0.0.0.0.
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"

  # Jalur kerja untuk mengedit: next dev, perubahan langsung terlihat di http://localhost:3001.
  # Hanya berjalan bila diminta: docker compose --profile dev up -d web-dev
  web-dev:
    profiles: ["dev"]
    build:
      context: ../apps/web
      target: dev
    container_name: school_web_dev
    restart: "no"
    environment:
      API_INTERNAL_URL: http://core-api:8000
    depends_on:
      - core-api
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: school_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
  ai-engine:
    build: ../services/ai-engine
    container_name: school_ai_engine
    restart: unless-stopped
    env_file:
      - ../services/ai-engine/.env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di infra/.env}
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8001:8001"
  # Backup harian database + file unggahan ke folder host (lihat infra/backup/backup.sh)
  db-backup:
    image: postgres:16
    container_name: school_db_backup
    restart: unless-stopped
    command: ["sh", "/backup/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: school_platform
      PGUSER: school_admin
      PGPASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di infra/.env}
      TZ: ${BACKUP_TZ:-Asia/Jayapura}
      BACKUP_HOUR: ${BACKUP_HOUR:-1}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
      BACKUP_SALINAN_AKTIF: ${BACKUP_SALINAN_DIR:+1}
      BACKUP_SALINAN_KEEP: ${BACKUP_SALINAN_KEEP:-7}
    depends_on:
      - db
    volumes:
      - ./backup:/backup:ro
      - ../services/core-api/storage/app:/storage:ro
      # Folder hasil backup di komputer host; arahkan ke disk lain/folder sinkron cloud lewat BACKUP_DIR
      - ${BACKUP_DIR:-../backups}:/backups
      # Salinan kedua di luar laptop, mis. BACKUP_SALINAN_DIR=C:/Users/<nama>/My Drive/EduRapor-backup
      - ${BACKUP_SALINAN_DIR:-../backups/.salinan-nonaktif}:/salinan

volumes:
  pgdata:
  core_api_vendor: