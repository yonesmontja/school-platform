version: "3.9"

services:
  db:
    image: postgres:16
    container_name: school_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_platform
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: school_password
    # Port database, redis, dan API hanya dibuka untuk komputer ini (bukan jaringan lokal/internet).
    # Akses dari luar lewat web (port 3000) atau tunnel cloudflared.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: school_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  core-api:
    build: ../services/core-api
    container_name: school_core_api
    restart: unless-stopped
    env_file:
      - ../services/core-api/.env
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../services/core-api:/var/www/html
      # vendor di volume Docker: membaca ribuan file vendor lewat bind mount Windows membuat tiap request ~4 detik
      - core_api_vendor:/var/www/html/vendor

  web:
    build: ../apps/web
    container_name: school_web
    restart: unless-stopped
    environment:
      # Browser memanggil /api di domain web; Next.js meneruskannya ke core-api lewat jaringan Docker
      API_INTERNAL_URL: http://core-api:8000
    depends_on:
      - core-api
    # Bawaan hanya untuk komputer ini; perangkat lain memakai tunnel HTTPS. Untuk membuka ke
    # jaringan lokal (http, tanpa enkripsi), jalankan dengan WEB_BIND=0.0.0.0.
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: school_cloudflared_named
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
  ai-engine:
    build: ../services/ai-engine
    container_name: school_ai_engine
    restart: unless-stopped
    env_file:
      - ../services/ai-engine/.env
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8001:8001"
  # Backup harian database + file unggahan ke folder host (lihat infra/backup/backup.sh)
  db-backup:
    image: postgres:16
    container_name: school_db_backup
    restart: unless-stopped
    command: ["sh", "/backup/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: school_platform
      PGUSER: school_admin
      PGPASSWORD: school_password
      TZ: ${BACKUP_TZ:-Asia/Jayapura}
      BACKUP_HOUR: ${BACKUP_HOUR:-1}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
    depends_on:
      - db
    volumes:
      - ./backup:/backup:ro
      - ../services/core-api/storage/app:/storage:ro
      # Folder hasil backup di komputer host; arahkan ke disk lain/folder sinkron cloud lewat BACKUP_DIR
      - ${BACKUP_DIR:-../backups}:/backups

volumes:
  pgdata:
  core_api_vendor: