version: "3.9"

services:
  db:
    image: postgres:16
    container_name: school_db
    environment:
      POSTGRES_DB: school_platform
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: school_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: school_redis
    ports:
      - "6379:6379"

  core-api:
    build: ../services/core-api
    container_name: school_core_api
    env_file:
      - ../services/core-api/.env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ../services/core-api:/var/www/html

  web:
    build: ../apps/web
    container_name: school_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - core-api
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next

  ai-engine:
    build: ../services/ai-engine
    container_name: school_ai_engine
    env_file:
      - ../services/ai-engine/.env
    depends_on:
      - db
      - redis
    ports:
      - "8001:8001"

volumes:
  pgdata: